<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lines of Action</title>
  <meta name="description" content="Lines of Action (LOA) — jogo de estratégia abstrato contra uma IA forte, ou entre dois jogadores.">
  <meta name="theme-color" content="#0d1017">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151a24'/%3E%3Cpath d='M18 46L32 32L46 18M32 32L46 46' stroke='%23f2b45a' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='18' cy='46' r='8' fill='%23f6efe0'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f6efe0'/%3E%3Ccircle cx='46' cy='18' r='8' fill='%23f6efe0'/%3E%3Ccircle cx='46' cy='46' r='8' fill='%23f6efe0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-black" cx="33%" cy="28%" r="75%">
        <stop offset="0" stop-color="#7a808e"/><stop offset=".3" stop-color="#353a45"/><stop offset=".7" stop-color="#14161b"/><stop offset="1" stop-color="#050506"/>
      </radialGradient>
      <radialGradient id="g-white" cx="33%" cy="28%" r="75%">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#faf6ee"/><stop offset=".7" stop-color="#e3d8c3"/><stop offset="1" stop-color="#c3b496"/>
      </radialGradient>
      <marker id="mk-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f8f5b"/></marker>
      <marker id="mk-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e0503a"/></marker>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M15.1 14c.2-1 .7-1.7 1.4-2.5A6 6 0 1 0 6 8c0 1.3.5 2.4 1.5 3.5.7.8 1.2 1.5 1.4 2.5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8V4z"/></symbol>
      <symbol id="i-first" viewBox="0 0 24 24"><path d="m17 18-6-6 6-6M7 6v12"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-last" viewBox="0 0 24 24"><path d="m7 18 6-6-6-6M17 6v12"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
      <symbol id="i-stone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></symbol>
      <symbol id="i-group" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><circle cx="12" cy="6" r="3"/><path d="M7.7 14.5 10.4 8.6M13.6 8.6l2.7 5.9M9 17h6"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Lines of Action">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M16 48 32 32 48 16M32 32l16 16" />
          <circle cx="16" cy="48" r="8" class="m-white" />
          <circle cx="32" cy="32" r="8" class="m-white" />
          <circle cx="48" cy="16" r="8" class="m-white" />
          <circle cx="48" cy="48" r="8" class="m-black" />
        </svg>
        <span class="brand-text">
          <span class="brand-title">Lines of Action</span>
          <span class="brand-tag" data-i18n="tagline">Conecte todas as suas peças</span>
        </span>
      </a>
      <nav class="top-actions">
        <button class="icon-btn" id="btn-rules" data-i18n-title="rules"><svg><use href="#i-help"/></svg></button>
        <button class="icon-btn" id="btn-sound" data-i18n-title="sound"><svg><use href="#i-sound"/></svg></button>
        <button class="icon-btn" id="btn-settings" data-i18n-title="settings"><svg><use href="#i-gear"/></svg></button>
      </nav>
    </header>

    <main class="layout">
      <section class="stage">
        <div class="player-card" id="card-top"></div>

        <div class="board-row">
          <div class="eval-bar" id="eval-bar" role="img">
            <div class="eval-fill" id="eval-fill"></div>
            <span class="eval-label" id="eval-label"></span>
          </div>
          <div class="board-frame">
            <div class="board" id="board" aria-label="Tabuleiro">
              <div class="squares" id="squares"></div>
              <svg class="layer links" id="links" viewBox="0 0 8 8" preserveAspectRatio="none" aria-hidden="true"></svg>
              <div class="layer pieces" id="pieces"></div>
              <svg class="layer arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true">
                <defs>
                  <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
                    <path d="M0 0 10 5 0 10z" />
                  </marker>
                  <marker id="arrowhead-hint" class="hint-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
                    <path d="M0 0 10 5 0 10z" />
                  </marker>
                </defs>
                <g id="arrows-g"></g>
              </svg>
              <div class="board-banner" id="board-banner" hidden></div>
            </div>
          </div>
        </div>

        <div class="player-card" id="card-bottom"></div>
      </section>

      <aside class="panel">
        <div class="status-card">
          <div class="status-main" id="status-main"></div>
          <div class="status-sub" id="status-sub"></div>
        </div>

        <div class="actions">
          <button class="btn primary" id="btn-new"><svg><use href="#i-plus"/></svg><span data-i18n="newGame">Nova partida</span></button>
          <button class="btn" id="btn-undo"><svg><use href="#i-undo"/></svg><span data-i18n="undo">Desfazer</span></button>
          <button class="btn" id="btn-hint"><svg><use href="#i-bulb"/></svg><span data-i18n="hint">Dica</span></button>
          <button class="btn" id="btn-pause" hidden><svg><use href="#i-pause"/></svg><span data-i18n="pause">Pausar</span></button>
        </div>

        <div class="moves-card">
          <div class="moves-head">
            <span data-i18n="moves">Lances</span>
            <div class="nav-btns">
              <button class="icon-btn sm" id="nav-first" data-i18n-title="navFirst"><svg><use href="#i-first"/></svg></button>
              <button class="icon-btn sm" id="nav-prev" data-i18n-title="navPrev"><svg><use href="#i-prev"/></svg></button>
              <button class="icon-btn sm" id="nav-next" data-i18n-title="navNext"><svg><use href="#i-next"/></svg></button>
              <button class="icon-btn sm" id="nav-last" data-i18n-title="navLast"><svg><use href="#i-last"/></svg></button>
            </div>
          </div>
          <ol class="move-list" id="move-list"></ol>
          <div class="moves-empty" id="moves-empty" data-i18n="noMoves">As pretas começam. Boa partida!</div>
        </div>

        <div class="info-line" id="info-line"></div>
      </aside>
    </main>

    <footer class="footer">
      <span data-i18n="footer">Jogo de Claude Soucie (1969).</span>
      <a href="https://github.com/andersonfaller/loa" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <!-- New game -->
  <div class="modal" id="modal-setup" role="dialog" aria-modal="true" aria-labelledby="setup-title" hidden>
    <div class="modal-card">
      <button class="icon-btn modal-close" data-close data-i18n-title="close"><svg><use href="#i-close"/></svg></button>
      <h2 id="setup-title" data-i18n="newGame">Nova partida</h2>

      <div class="field">
        <div class="field-label" data-i18n="mode">Modo</div>
        <div class="choice-grid three" id="opt-mode">
          <button class="choice" data-value="ai"><svg><use href="#i-cpu"/></svg><span data-i18n="modeAi">Contra o computador</span></button>
          <button class="choice" data-value="pvp"><svg><use href="#i-users"/></svg><span data-i18n="modePvp">Dois jogadores</span></button>
          <button class="choice" data-value="aivai"><svg><use href="#i-eye"/></svg><span data-i18n="modeAiAi">Assistir IA × IA</span></button>
        </div>
      </div>

      <div class="field" data-for="ai">
        <div class="field-label" data-i18n="yourColor">Suas peças</div>
        <div class="segmented" id="opt-color">
          <button data-value="black"><i class="dot black"></i><span data-i18n="blackStarts">Pretas (começam)</span></button>
          <button data-value="white"><i class="dot white"></i><span data-i18n="whiteSide">Brancas</span></button>
          <button data-value="random"><i class="dot random"></i><span data-i18n="random">Sorteio</span></button>
        </div>
      </div>

      <div class="field" data-for="ai aivai">
        <div class="field-label" data-i18n="difficulty">Dificuldade</div>
        <div class="levels" id="opt-level"></div>
        <div class="level-desc" id="level-desc"></div>
      </div>

      <div class="field">
        <div class="field-label" data-i18n="variant">Variante</div>
        <div class="segmented" id="opt-variant">
          <button data-value="standard"><span data-i18n="variantStandard">Clássica</span></button>
          <button data-value="scrambled"><span data-i18n="variantScrambled">Scrambled Eggs</span></button>
        </div>
      </div>

      <button class="btn primary wide" id="btn-start" data-i18n="start">Começar</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="modal" id="modal-settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="modal-card narrow">
      <button class="icon-btn modal-close" data-close data-i18n-title="close"><svg><use href="#i-close"/></svg></button>
      <h2 id="settings-title" data-i18n="settings">Configurações</h2>
      <div class="field">
        <div class="field-label" data-i18n="theme">Tabuleiro</div>
        <div class="themes" id="opt-theme">
          <button data-value="wood"><span class="swatch wood"></span><span data-i18n="themeWood">Madeira</span></button>
          <button data-value="slate"><span class="swatch slate"></span><span data-i18n="themeSlate">Ardósia</span></button>
          <button data-value="jade"><span class="swatch jade"></span><span data-i18n="themeJade">Jade</span></button>
          <button data-value="marble"><span class="swatch marble"></span><span data-i18n="themeMarble">Mármore</span></button>
        </div>
      </div>
      <div class="toggles" id="opt-toggles">
        <label class="toggle"><span data-i18n="optLinks">Mostrar conexões entre peças</span><input type="checkbox" data-key="links"><i></i></label>
        <label class="toggle"><span data-i18n="optLegal">Mostrar lances possíveis</span><input type="checkbox" data-key="legal"><i></i></label>
        <label class="toggle"><span data-i18n="optEval">Barra de avaliação</span><input type="checkbox" data-key="evalBar"><i></i></label>
        <label class="toggle"><span data-i18n="optCoords">Coordenadas</span><input type="checkbox" data-key="coords"><i></i></label>
        <label class="toggle"><span data-i18n="optAnim">Animações</span><input type="checkbox" data-key="anim"><i></i></label>
        <label class="toggle"><span data-i18n="optSound">Efeitos sonoros</span><input type="checkbox" data-key="sound"><i></i></label>
      </div>
      <div class="field">
        <div class="field-label" data-i18n="language">Idioma</div>
        <div class="segmented" id="opt-lang">
          <button data-value="pt">Português</button>
          <button data-value="en">English</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Rules -->
  <div class="modal" id="modal-rules" role="dialog" aria-modal="true" aria-labelledby="rules-title" hidden>
    <div class="modal-card wide-card">
      <button class="icon-btn modal-close" data-close data-i18n-title="close"><svg><use href="#i-close"/></svg></button>
      <h2 id="rules-title" data-i18n="rulesTitle">Como jogar</h2>
      <p class="rules-lead" data-i18n="rulesLead"></p>
      <div class="rules-grid" id="rules-grid"></div>
      <div class="rules-extra">
        <h3 data-i18n="rulesMoreTitle">Detalhes</h3>
        <ul id="rules-more"></ul>
      </div>
      <button class="btn primary wide" data-close data-i18n="gotIt">Entendi!</button>
    </div>
  </div>

  <!-- Game over -->
  <div class="modal" id="modal-over" role="dialog" aria-modal="true" aria-labelledby="over-title" hidden>
    <div class="modal-card narrow over-card">
      <div class="over-emblem" id="over-emblem"></div>
      <h2 id="over-title"></h2>
      <p class="over-sub" id="over-sub"></p>
      <div class="over-stats" id="over-stats"></div>
      <div class="over-actions">
        <button class="btn" id="btn-review" data-i18n="review">Revisar partida</button>
        <button class="btn primary" id="btn-again" data-i18n="playAgain">Jogar novamente</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
